[Extension]
Name = sd-webui-llama-server-enhance

# Order our process() callback after sd-dynamic-prompts, so DP expands
# wildcards/variants before we enhance (the extension never sees raw
# wildcards). Callback names are "<canonical>/<script file>/<category>/
# <class name>", built by modules/scripts.py add_callback. If DP is not
# installed (or renames its script), the instruction is ignored and the
# default alphabetical discovery order (which already puts DP first)
# applies.
[callbacks/sd-webui-llama-server-enhance/scripts/prompt_enhancer.py/script_process/LlamaServerEnhance]
After = sd-dynamic-prompts/scripts/dynamic_prompting.py/script_process/Script
